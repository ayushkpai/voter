<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voter - Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <div class="outer">
      <div class="card">
        <p class="subtitle">Choose how you want to vote</p>
        <div class="options">
          <a href="/item-voting" class="option red">
            <span class="left">
              <span class="emoji">📦</span>
              <span>Item Voting</span>
            </span>
            <span class="arrow">→</span>
          </a>

          <a href="/vote" class="option blue">
            <span class="left">
              <span class="emoji">🗳️</span>
              <span>Just Vote</span>
            </span>
            <span class="arrow">→</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
